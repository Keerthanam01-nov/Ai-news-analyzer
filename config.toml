# Put this file in GitHub at:  .streamlit/config.toml
# It forces ONE bright theme for every visitor, so text is never white-on-light.
[theme]
base = "light"
primaryColor = "#5B3DF5"
backgroundColor = "#F5F6FB"
secondaryBackgroundColor = "#EEF0FF"
textColor = "#d6d5e3"
font = "sans serif"

[client]
toolbarMode = "viewer"
