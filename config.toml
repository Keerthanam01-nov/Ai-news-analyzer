# Put this file in your GitHub repo at:  .streamlit/config.toml
# It forces ONE bright theme for every visitor, so text is never white-on-cream.
[theme]
base = "light"
primaryColor = "#6C4DFF"
backgroundColor = "#FFFBF2"
secondaryBackgroundColor = "#F1ECFF"
textColor = "#1F1B3A"
font = "sans serif"

[client]
toolbarMode = "minimal"
